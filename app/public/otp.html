<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIMAO OS — Vérification en deux étapes</title>
  <script>document.documentElement.classList.add('bma-js')</script>
  <link rel="stylesheet" href="css/tailwind.build.css">
  <link rel="stylesheet" href="css/custom.css">
  <style>
    body {
      background-color: #020617;
      min-height: 100vh;
    }
    /* A dedicated fixed layer for the background image — `background-attachment: fixed`
       directly on body prevents backdrop-filter from blurring it in Chromium, so the
       image lives on its own layer behind everything instead. */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: linear-gradient(rgba(2,6,23,0.2), rgba(2,6,23,0.2)), url('assets/login-bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .auth-card {
      background-color: rgba(10, 15, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.65);
    }
    .otp-input {
      background-color: rgba(2, 6, 23, 0.55);
      border: 1px solid #334155;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .otp-input:focus {
      outline: none;
      border-color: var(--bimao-blue-text);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
    }
    .otp-input.filled { border-color: var(--bimao-blue-text); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    /* Same BIMAO wordmark badge used above the activation key on login.html — exact
       109x30.77 crop of the exported lockup asset. Plain CSS because
       css/tailwind.build.css is a static pre-built file, so arbitrary-value utility
       classes compile to nothing. */
    .brand-badge-mini {
      position: relative;
      width: 109px;
      height: 30.77px;
      border-radius: 8px;
      background-color: #ffffff;
      overflow: hidden;
    }
    .brand-badge-mini img {
      position: absolute;
      width: 100%;
      max-width: none;
      height: 132.84%;
      left: -0.24%;
      top: -13.88%;
    }
    /* css/custom.css sets a plain `button { background-color: ... }` rule outside any
       @layer, which beats Tailwind v4's layered .bg-[#00007B] utility regardless of
       specificity — cascade layers always lose to unlayered styles. Override explicitly. */
    #verify-btn {
      background-color: #00007B;
    }
    #verify-btn:hover:not(:disabled) {
      background-color: #0000a0;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-[#f8fafc] relative">
  <div class="bg-layer"></div>

  <!-- Brand mark -->
  <div class="p-8">
    <a href="login.html" class="inline-flex items-center space-x-3">
      <div class="w-9 h-9 bg-white rounded-lg flex items-center justify-center p-1.5 shadow-lg shadow-black/40 shrink-0">
        <img src="assets/logo.png" alt="BIMAO" class="w-full h-full object-contain">
      </div>
      <span class="font-bold text-lg tracking-tight text-white">BIMAO</span>
    </a>
  </div>

  <!-- Auth card -->
  <div class="flex-1 flex items-center justify-center px-4 pb-16">
    <div class="auth-card w-full max-w-md rounded-2xl p-10 sm:p-12 text-center">

      <div class="brand-badge-mini mx-auto mb-6">
        <img src="assets/bimao-badge.png" alt="BIMAO — Banque des Institutions Mutualistes d'Afrique de l'Ouest">
      </div>

      <h1 class="text-2xl font-bold text-white tracking-tight">Plus qu'une étape</h1>
      <p class="text-sm text-subtitle mt-3 leading-relaxed">
        Un code à 6 chiffres vient d'être envoyé à :
      </p>
      <p id="email-display" class="text-sm font-semibold text-white mt-1">votre.email@bimao-cf.com</p>

      <form id="otp-form" class="mt-8">
        <div class="flex items-center justify-center gap-2 sm:gap-3" id="otp-inputs">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-input w-11 h-13 sm:w-12 sm:h-14 rounded-xl text-center text-xl font-bold text-white" style="height:3.25rem" autocomplete="one-time-code">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-input w-11 h-13 sm:w-12 sm:h-14 rounded-xl text-center text-xl font-bold text-white" style="height:3.25rem">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-input w-11 h-13 sm:w-12 sm:h-14 rounded-xl text-center text-xl font-bold text-white" style="height:3.25rem">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-input w-11 h-13 sm:w-12 sm:h-14 rounded-xl text-center text-xl font-bold text-white" style="height:3.25rem">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-input w-11 h-13 sm:w-12 sm:h-14 rounded-xl text-center text-xl font-bold text-white" style="height:3.25rem">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-input w-11 h-13 sm:w-12 sm:h-14 rounded-xl text-center text-xl font-bold text-white" style="height:3.25rem">
        </div>

        <button id="verify-btn" type="submit" disabled class="w-full mt-8 bg-[#00007B] hover:bg-[#0000a0] text-white font-semibold text-sm rounded-xl py-3.5 shadow-lg shadow-[#00007B]/40 transition-colors">
          Vérifier le code
        </button>
      </form>

      <p class="text-xs text-subtitle mt-6">
        Vous n'avez rien reçu ?
        <button id="resend-btn" type="button" disabled class="font-semibold text-blue-400 hover:text-blue-300 disabled:text-slate-500">
          Renvoyer le code <span id="timer">(60s)</span>
        </button>
      </p>

      <a href="login.html" class="inline-block mt-6 text-xs font-medium text-slate-400 hover:text-slate-300">← Retour à la connexion</a>

      <p class="text-[11px] text-label mt-8 pt-6 border-t border-white/5">
        Ce code expire dans 5 minutes.
      </p>
    </div>
  </div>

  <footer class="text-center pb-6">
    <p class="text-[11px] text-label">© 2026 BIMAO — Système d'information Direction Générale. Tous droits réservés.</p>
  </footer>

  <script src="js/transitions.js"></script>
  <script>
    // Display the email passed from the login step, if present
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    if (email) document.getElementById('email-display').textContent = email;

    // OTP input behavior: digits only, auto-advance, backspace, paste
    const inputs = Array.from(document.querySelectorAll('.otp-input'));
    const verifyBtn = document.getElementById('verify-btn');

    function refreshState() {
      const allFilled = inputs.every(i => i.value.length === 1);
      verifyBtn.disabled = !allFilled;
    }

    inputs.forEach((input, idx) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '').slice(0, 1);
        input.classList.toggle('filled', input.value.length === 1);
        if (input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
        refreshState();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) inputs[idx - 1].focus();
      });
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const digits = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, inputs.length).split('');
        digits.forEach((d, i) => { if (inputs[i]) { inputs[i].value = d; inputs[i].classList.add('filled'); } });
        const next = Math.min(digits.length, inputs.length - 1);
        inputs[next].focus();
        refreshState();
      });
    });
    inputs[0].focus();

    document.getElementById('otp-form').addEventListener('submit', (e) => {
      e.preventDefault();
      sessionStorage.setItem('bimao_auth', '1');
      window.bmaNavigate('/');
    });

    // 60s resend countdown
    let remaining = 60;
    const timerEl = document.getElementById('timer');
    const resendBtn = document.getElementById('resend-btn');
    const countdown = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(countdown);
        timerEl.textContent = '';
        resendBtn.disabled = false;
      } else {
        timerEl.textContent = '(' + remaining + 's)';
      }
    }, 1000);
    resendBtn.addEventListener('click', () => {
      if (resendBtn.disabled) return;
      remaining = 60;
      resendBtn.disabled = true;
      const restarted = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(restarted);
          timerEl.textContent = '';
          resendBtn.disabled = false;
        } else {
          timerEl.textContent = '(' + remaining + 's)';
        }
      }, 1000);
    });
  </script>
</body>
</html>
